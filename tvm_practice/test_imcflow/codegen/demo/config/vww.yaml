# MobileNetV1 / Visual Wake Words (VWW) chip inference-only demo config.
# Select with DEMO_WORKLOAD=vww. Mirrors resnet8.yaml; task-specific fields differ.
# Input sample = 96x96 RGB COCO crop, shown as a photo.

task:
  name: vww
  title: "MobileNetV1 on IMCFlow chip · Visual Wake Words"
  # logit index -> class name. Order from CIM deploy/prepare_vww_chip_inputs.py:
  #   VWW_CLASSES = ["non_person", "person"]  (0 = non_person, 1 = person).
  classes:
    - non_person
    - person
  num_classes: 2

# 실행 소스: "mock"(canned txt 재생) | "chip"(실제 SSH).
profile: chip

mock:
  fixture: fixtures/vww_iter001_100.txt
  delay_ms: 300

chip:
  ssh_host: petalinux2
  ssh_port: 1326
  ssh_user: root
  auth_method: key
  console_log_level: RAW
  remote_base_path: /home/root/tvm/tvm_practice/test_imcflow/codegen
  # warmup-off per-model binary (IMCFLOW_NO_PERKERNEL_WARMUP=1 at codegen).
  # Co-resident on chip with .resnet8/.kws. per-sample ~0.45 s (47 imcflow kernels).
  binary_dir: host_binary_make.dataset.vww
  dataset_exec: execute_graph_for_dataset
  dataset_name: vww               # dataset/<name>/_staged for staged_npy image source
  eval_cpu: 3
  debug_dump_dir: /var/volatile/debug_nodes
  heartbeat_path: /var/volatile/imcflow_chip_heartbeat.txt
  warmup_dir: /home/root/imcflow/xilinx/petalinux-csrc   # per-RUN warmup 1회 (추론 전/후)
  graph_path: host_binary_make.dataset.vww/build/mlf/executor-config/graph/default.graph
  params_path: host_binary_make.dataset.vww/build/mlf/parameters/default.params
  images_path: dataset/vww/_staged/images.npy
  labels_path: dataset/vww/_staged/labels.npy
  remote_result_path: /tmp/tvm_dataset_results.txt

run:
  # dataset/vww/_staged = 100샘플. 실측 ~0.45 s/샘플 (warmup-off).
  num_samples: 100

# Input display: 96x96 RGB already in 0..1 -> photo (no denorm, no sample_map).
image_source: staged_npy
# Baked staged inputs (git-lfs on laptop; 11MB). Same 100 samples the chip runs.
# Falls back to codegen/dataset/vww/_staged on the server if this fixture is absent.
staged_images_fixture: fixtures/vww_staged_images.npy
display:
  kind: raw01
  aspect: "1"
  pixelated: false
