# ResNet8 / CIFAR-10 chip inference-only demo config
# 이 파일 하나가 데모의 모든 task-specific / 접속 파라미터를 담는다.
# mock <-> chip 전환은 profile 값만 바꾸면 된다 (코드 수정 불필요).

task:
  name: resnet8
  title: "ResNet8 on IMCFlow chip · CIFAR-10"
  # metadata.json["classes"] 와 반드시 동일 순서 (logit index -> class name)
  classes:
    - airplane
    - automobile
    - bird
    - cat
    - deer
    - dog
    - frog
    - horse
    - ship
    - truck
  num_classes: 10

# 실행 소스: "mock"(canned txt 재생) | "chip"(실제 SSH)
# chip 은 노트북에서 실연결 검증 완료 (2026-07-27, 100샘플 80%).
profile: chip

mock:
  # fixtures/ 에 박제된 canned 결과 (실제 best checkpoint iter_009 500샘플)
  fixture: fixtures/resnet8_iter009_500.txt
  # 샘플 간 재생 지연 (ms). 실제 데모(chip)에서는 무시된다.
  delay_ms: 300

chip:
  # ── 서버에서 20샘플 90% 재현 검증됨 (2026-07-27). ──
  # 공인IP(petalinux2:1326) 그대로 사용. 내부망 전환은 데모장 직전에 HostName/Port 만 변경.
  # ssh_config 의 Host 별칭. 노트북 ~/.ssh/config 의 petalinux2 를 그대로 참조.
  ssh_host: petalinux2
  ssh_port: 1326          # scan_steps.sh 는 -p $REMOTE_PORT 로 config Port 를 덮으므로 여기 값이 최종 포트
  ssh_user: root
  auth_method: key        # key => BatchMode=yes (키 필수). 데모 전 known_hosts 등록 1회 필요
  console_log_level: RAW  # INFO 가 아니어야 per-sample stdout 이 filter 에 안 걸린다

  # 원격에서 돌릴 실행 커맨드 구성요소. run_dataset_eval.sh 스텝6 REMOTE_CMD 를 그대로 복제.
  # (준비 스텝에서 아래 원격 경로에 자산이 이미 적재돼 있어야 함)
  # ⚠️ 76.4% fixture 실행이 쓴 실제 base = /home/root/tvm/tvm_practice/test_imcflow/codegen.
  #    /home/root/imcflow 로 두면 scan register 경로 불일치로 칩 출력이 죽어 전부 class 0 예측(정확도 0%)이 난다.
  remote_base_path: /home/root/tvm/tvm_practice/test_imcflow/codegen
  # warmup-off per-model binary: per-kernel `make warmup` removed at codegen via
  # IMCFLOW_NO_PERKERNEL_WARMUP=1. Co-resident on chip with .kws/.vww so switching
  # models needs no re-transfer. ~16x faster than the old shared warmup-on binary
  # (resnet8: 4.0 s -> 0.27 s/sample, 100 samples) with no accuracy change (80%).
  binary_dir: host_binary_make.dataset.resnet8
  dataset_exec: execute_graph_for_dataset   # DEBUG_EXE=1 이면 debug_execute_graph_for_dataset
  eval_cpu: 3                               # taskset 핀 (CPU0 IRQ 경합 회피)
  debug_dump_dir: /var/volatile/debug_nodes
  heartbeat_path: /var/volatile/imcflow_chip_heartbeat.txt
  warmup_dir: /home/root/imcflow/xilinx/petalinux-csrc   # make clear_time && make warmup (추론 전/후, per-RUN 1회)
  graph_path: host_binary_make.dataset.resnet8/build/mlf/executor-config/graph/default.graph
  params_path: host_binary_make.dataset.resnet8/build/mlf/parameters/default.params
  # _staged   = 서버가 올린 20샘플 (그대로 보존)
  # _stagedN  = fixtures/cifar10_test_images.npy[0:N] + cifar10_test_labels.npy[0:N] 슬라이스.
  #             `python3 make_staged.py N` 으로 생성(라벨 10000장 박제로 500 상한 없음, 최대 N=10000).
  #             생성물의 배열 값이 서버 _staged 와 픽셀 일치함을 검증했다(동일 소스).
  images_path: dataset/cifar10/_staged100/images.npy
  labels_path: dataset/cifar10/_staged100/labels.npy
  remote_result_path: /tmp/tvm_dataset_results.txt

run:
  # chip.images_path 가 가리키는 staged 파일의 샘플 수를 넘기지 말 것 (초과 시 배열 밖 read).
  # 현재 _staged100 = 100샘플. 더 늘리려면 make_staged.py N -> scp -> 이 두 값 갱신.
  # 실측 소요(warmup-off 바이너리): 샘플당 ~0.27s. 100=27초 / 500=2.2분 / 10000=45분.
  #   (옛 warmup-on 공유 바이너리는 ~4.0s/샘플 = 100샘플 6.7분이었음. per-kernel warmup 제거로 16x.)
  # 정확도는 표본↑ 일수록 컴파일 정확도(76.4%)로 수렴: 20샘플 90% → 100샘플 80% → 500↓.
  num_samples: 100

# 화면에 띄울 사진의 소스.
#   "full_npy"    : 노트북 기본. fixtures/cifar10_test_images.npy (10000장 정규화 float32, git-lfs 박제)를
#                   orig_idx(sample_map)로 조회 + 역정규화. torchvision/다운로드 불필요, git pull 만으로 사진 확보.
#   "staged_npy"  : 서버 검증용. dataset/cifar10/_staged/images.npy (500장)를 staged 순번으로 조회 + 역정규화.
image_source: full_npy

# ── on-chip execution speed 패널 (화면 표기 기준. 내부 키는 pipelined) ──
# 실시간 데모는 atomic 모드(convolution 을 하나씩 실행)라 느리다. 이 패널은 pipelined
# 실행의 on-chip 처리 속도를 보여주기 위한 것으로, 정확도는 다루지 않는다.
# ⚠️ 이 수치는 off-chip CPU<->NPU 전송 시간을 뺀 값이다(실제로는 숨길 수 있어서).
#    화면에도 각주로 그렇게 밝혀 두었다 — 수치를 바꿀 땐 각주 전제도 같이 확인할 것.
# 재생 길이 = total_samples × ms_per_sample (여기선 10000 × 1.209ms = 12.1초).
# 모자이크는 make_mosaic.py 가 입력 배열에서 균등 추출해 만든 완성본 PNG 1장이고,
# 프론트가 타일을 순서대로 드러내며 재생한다.
# 세 워크로드가 모두 1000샘플 기준이다(모자이크 타일 수 = progress bar 총량 = 1000).
# 워크로드마다 전체 크기가 달라(10000/12105/10961) 전체를 쓰면 재생 길이가 12s/2.7s/56s 로
# 제각각이었다. 1000 으로 통일하면 패널끼리 비교가 되고 vww 도 5초대로 들어온다.
pipelined:
  ms_per_sample: 1.209
  total_samples: 1000           # 1000 × 1.209ms = 1.21초
  mosaic: fixtures/resnet8_mosaic.png
  mosaic_cols: 50
  mosaic_rows: 20

# 샘플 순번 -> 원본 CIFAR-10 인덱스 매핑 (노트북 로컬 원본 사진 조회용).
# 순차 가정 금지: 반드시 이 맵으로만 조회한다.
sample_map: fixtures/sample_map.json
